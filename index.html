<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="assets/css/styles.css" />
        <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />

        <!-- zero-md para renderizar markdown -->
        <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>

        <title>DESARROLLO TI 55</title>
    </head>
    <body>
        <nav>
            <a href="/" class="nav_brand">DESARROLLO TI 55</a>
        </nav>

        <div class="layout">
            <!-- Sidebar con lista de documentos -->
            <aside class="sidebar" id="sidebar">
                <button class="sidebar_toggle" id="sidebar_toggle" aria-label="Cerrar menu">✕</button>
                <h2 class="sidebar_title">Documentos</h2>
                <ul class="sidebar_list" id="document_list"></ul>
            </aside>

            <!-- Contenido principal -->
            <main class="main">
                <div class="main_header">
                    <button class="menu_button" id="menu_button" aria-label="Abrir menu">☰</button>
                    <p class="main_slug" id="document_slug"></p>
                </div>
                <h1 class="main_title" id="document_title"></h1>
                <zero-md id="content">
                    <template data-append>
                        <link rel="stylesheet" href="assets/css/markdown-styles.css" />
                    </template>
                </zero-md>
            </main>
        </div>

        <footer>
            <p>&copy; 2026 <a href="https://github.com/desarrolloti55" target="_blank">Desarrollo TI 55</a></p>
        </footer>

        <!-- Supabase -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script type="module" src="assets/js/api.js"></script>
    </body>
</html>
