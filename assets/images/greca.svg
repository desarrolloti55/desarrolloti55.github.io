<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="150" viewBox="0 0 96 150" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <defs>
        <!-- Llave griega grande: espiral cuadrada que nace de una línea base continua (periodo 48) -->
        <path id="llave-grande" d="M6 40 V10 H42 V32 H18 V20 H30 V26" />
        <!-- Llave griega fina (periodo 24) -->
        <path id="llave-fina" d="M3 18 V5 H21 V13 H9 V9 H15 V11" />
        <!-- Hoja de laurel: dos trazos oblicuos que nacen del tallo (periodo 12) -->
        <path id="hoja" d="M3 8 L8 3 M3 8 L8 13" />
    </defs>

    <!-- Banda 1: llave griega grande, con barras en los extremos -->
    <g stroke="#d4a23a" stroke-opacity="0.55" stroke-width="2.5">
        <path d="M0 2 H96" />
        <path d="M0 46 H96" />
    </g>
    <g stroke="#2bb8c9" stroke-opacity="0.6" stroke-width="3">
        <path d="M0 40 H96" />
        <use href="#llave-grande" xlink:href="#llave-grande" />
        <use href="#llave-grande" xlink:href="#llave-grande" x="48" />
    </g>

    <!-- Banda 2: llave fina entre dos filetes -->
    <g transform="translate(0 54)">
        <g stroke="#d4a23a" stroke-opacity="0.55" stroke-width="1.5">
            <path d="M0 1 H96" />
            <path d="M0 23 H96" />
        </g>
        <g stroke="#2bb8c9" stroke-opacity="0.6" stroke-width="2">
            <path d="M0 18 H96" />
            <use href="#llave-fina" xlink:href="#llave-fina" />
            <use href="#llave-fina" xlink:href="#llave-fina" x="24" />
            <use href="#llave-fina" xlink:href="#llave-fina" x="48" />
            <use href="#llave-fina" xlink:href="#llave-fina" x="72" />
        </g>
    </g>

    <!-- Banda 3: onda continua entre dos filetes -->
    <g transform="translate(0 84)">
        <g stroke="#d4a23a" stroke-opacity="0.55" stroke-width="2">
            <path d="M0 1 H96" />
            <path d="M0 15 H96" />
        </g>
        <path d="M0 8 q6 -7 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" stroke="#2bb8c9" stroke-opacity="0.6" stroke-width="2.5" />
    </g>

    <!-- Banda 4: laurel, hojas a ambos lados de un tallo -->
    <g transform="translate(0 106)" stroke="#d4a23a" stroke-opacity="0.6" stroke-width="2">
        <path d="M0 8 H96" />
        <use href="#hoja" xlink:href="#hoja" />
        <use href="#hoja" xlink:href="#hoja" x="12" />
        <use href="#hoja" xlink:href="#hoja" x="24" />
        <use href="#hoja" xlink:href="#hoja" x="36" />
        <use href="#hoja" xlink:href="#hoja" x="48" />
        <use href="#hoja" xlink:href="#hoja" x="60" />
        <use href="#hoja" xlink:href="#hoja" x="72" />
        <use href="#hoja" xlink:href="#hoja" x="84" />
    </g>

    <!-- Banda 5: escalones (onda cuadrada) -->
    <path transform="translate(0 128)" d="M0 14 V3 H8 V14 H16 V3 H24 V14 H32 V3 H40 V14 H48 V3 H56 V14 H64 V3 H72 V14 H80 V3 H88 V14 H96" stroke="#2bb8c9" stroke-opacity="0.6" stroke-width="2.5" />
</svg>
