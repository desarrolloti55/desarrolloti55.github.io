<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-opacity="0.25">
    <!-- Anillos concéntricos con marcas, como el plano de una ciudad circular -->
    <g stroke="#2bb8c9">
        <circle cx="48" cy="48" r="30" />
        <circle cx="48" cy="48" r="18" />
        <path d="M48 12 V24 M48 72 V84 M12 48 H24 M72 48 H84" />
    </g>
    <!-- Glifo triangular con punto central -->
    <g stroke="#d4a23a">
        <path d="M150 20 L178 68 H122 Z" />
        <path d="M150 36 L164 60 H136 Z" />
        <circle cx="150" cy="54" r="1.5" />
    </g>
    <!-- Cenefa escalonada -->
    <g stroke="#d4a23a">
        <path d="M20 160 h14 v-12 h14 v12 h14 v-12 h14 v12 h14" />
    </g>
    <!-- Glifo de cristal: rombo con eje vertical -->
    <g stroke="#2bb8c9">
        <path d="M150 112 L170 140 L150 168 L130 140 Z" />
        <path d="M150 112 V168 M130 140 H170" />
    </g>
</svg>
